name: Issue 3 isolated verification

on:
  push:
    branches:
      - feature/3_access_code_login

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate npm 11 lockfile
        run: |
          npm --version
          npm install --save-dev --save-exact --package-lock-only supabase@2.122.1
          npm ci
      - name: Start local Supabase
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - run: supabase start
      - name: Generate public schema types and format
        run: |
          npm run db:types
          npm run format
      - name: Save generated reproducible files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/internal/shared/supabase/database.types.ts
          git add -u -- . ':(exclude).github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m "chore: 生成依赖锁文件、数据库类型并统一格式"
            git push origin HEAD:feature/3_access_code_login
          fi
      - name: Database tests
        run: npx supabase test db
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      - name: Build Storybook
        run: npm run build-storybook
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
