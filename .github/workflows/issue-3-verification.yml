name: Issue 3 isolated verification

on:
  push:
    branches:
      - feature/3_access_code_login

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies with npm 11
        run: |
          node --version
          npm --version
          npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Start Supabase
        run: supabase start

      - name: Database tests
        run: npx supabase test db

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
