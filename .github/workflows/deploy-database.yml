name: Deploy database

# 把 supabase/migrations/ 推到线上 Supabase。只连接远端数据库，不启动 Docker。
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# 同一时间只允许一次推送，后到的排队，不取消正在进行的推送。
concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-migrations:
    name: Push migrations to production
    runs-on: ubuntu-latest

    env:
      # 项目 ref 不是机密；Access token 与数据库密码只放在 Repository secrets。
      SUPABASE_PROJECT_REF: jvsflkbpggujigbqymzj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        run: supabase db push --linked --dry-run

      - name: Push migrations
        run: supabase db push --linked
