name: CI

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  RUN_CODE_CI: &run_code_ci >-
    github.event_name != 'pull_request' ||
    startsWith(github.head_ref, 'docs/') == false

jobs:
  # Stage 1: 并行静态检查
  type-check:
    name: Type check
    if: *run_code_ci
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  format-check:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    if: *run_code_ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint

  # Stage 2: 依赖 Stage 1 运行单元测试
  test:
    name: Test
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'docs/') == false)
    needs: [format-check, type-check, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Verify prerequisite checks
        env:
          FORMAT_CHECK_RESULT: ${{ needs['format-check'].result }}
          TYPE_CHECK_RESULT: ${{ needs['type-check'].result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          if [ "$FORMAT_CHECK_RESULT" != "success" ] || \
             [ "$TYPE_CHECK_RESULT" != "success" ] || \
             [ "$LINT_RESULT" != "success" ]; then
            echo "Format check: $FORMAT_CHECK_RESULT"
            echo "Type check: $TYPE_CHECK_RESULT"
            echo "Lint: $LINT_RESULT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm run test

  database:
    name: Database tests and generated types
    if: *run_code_ci
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Start local Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Verify generated database types
        run: |
          npm run db:types
          npx prettier src/internal/shared/supabase/database.types.ts --write
          git diff --exit-code -- src/internal/shared/supabase/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # Stage 3: build 和 storybook-build 并行，只等待测试完成
  build:
    name: Build
    if: *run_code_ci
    needs: [test]
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run build
        run: npm run build

  storybook-build:
    name: Storybook build
    if: *run_code_ci
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v5
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v6
        with:
          name: storybook-static
          path: storybook-static

  temporary-prettier-output:
    name: Temporary formatter output (remove before merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - name: Format three feature branches and print changed files
        shell: bash
        run: |
          set -euo pipefail
          for branch in feature/40_records feature/41_pricing_settings feature/42_photo_cleanup; do
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout --force --detach "origin/$branch"
            mapfile -d '' files < <(git diff --name-only --diff-filter=ACM -z origin/main HEAD -- '*.ts' '*.tsx' '*.json')
            if [ "${#files[@]}" -gt 0 ]; then
              npx prettier --write "${files[@]}"
            fi
            BRANCH="$branch" node - <<'NODE'
          const fs = require("fs");
          const {execFileSync} = require("child_process");
          const branch = process.env.BRANCH;
          const files = execFileSync("git", ["diff","--name-only","-z"]).toString().split("\0").filter(Boolean);
          console.log("FORMAT_SUMMARY:" + JSON.stringify({ branch, count: files.length }));
          for (const path of files) {
            const content = fs.readFileSync(path, "utf8");
            const count = Math.ceil(content.length / 1200);
            for (let index = 0; index < count; index++) {
              console.log("FORMATTED_FILE:" + JSON.stringify({
                branch, path, index, count,
                content: content.slice(index * 1200, (index + 1) * 1200),
              }));
            }
          }
          NODE
          done

# 临时格式化任务触发器，最终修复时删除。
