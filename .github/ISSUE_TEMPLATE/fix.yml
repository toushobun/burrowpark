name: Fix
description: Bug 修正・问题修复相关 Issue
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题内容
      description: 请用中文说明发生了什么问题。
      placeholder: 例如：续费后车位仍显示已过期。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再现步骤
      description: 如何复现该问题？
      placeholder: |
        1. 点击已过期的车位
        2. 续费 1 天
        3. 回到车位地图
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 正常情况下应该是什么样？
    validations:
      required: false
  - type: textarea
    id: tasks
    attributes:
      label: TODO
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 备注
    validations:
      required: false
